name: Web

# Publica web/ en GitHub Pages. No compila nada: copia archivos y los sube.
# Repo público: los minutos de Actions no cuentan.
#
# Dos formas de lanzarla:
# - Sola, cada día a las 21:30 hora peninsular, con el precio de mañana ya incluido. REE publica
#   el PVPC de mañana cada tarde (sus respuestas marcan la actualización hacia las 20:45), así que
#   a las 21:30 hay margen. Antes de publicar pone al día el histórico de precios y de generación
#   (datos/), con el PVPC de mañana, y la actividad del equipo de «Cómo se ha hecho»
#   (web/datos/actividad.json), y guarda esos datos en main. Es la única publicación automática.
#   Si REE aún no ha publicado mañana, se publica igual con lo que haya y la siguiente ejecución
#   lo vuelve a intentar.
# - A mano (Actions > Web > Run workflow), cuando lo fusionado cambia lo que se ve. Publica main
#   tal cual, con la actividad del equipo al día. Marcando «actualizar», hace también lo de la
#   publicación diaria.
#
# Hora: el cron de Actions va en UTC y no sabe del cambio de hora. Hay dos horarios, 19:30 UTC
# (las 21:30 en verano, UTC+2) y 20:30 UTC (las 21:30 en invierno, UTC+1), y el primer trabajo
# deja seguir solo al que cae a las 21:30 en Madrid ese día. Se mira qué horario saltó y no la
# hora del reloj, porque GitHub puede retrasar unos minutos los trabajos programados.

on:
  workflow_dispatch:
    inputs:
      actualizar:
        description: "Poner al día también el histórico y guardarlo en main (como la publicación diaria)"
        type: boolean
        default: false
  schedule:
    - cron: "30 19 * * *"
    - cron: "30 20 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  # Sin cancelar a medias: la publicación diaria guarda datos en main antes de publicar.
  cancel-in-progress: false

jobs:
  hora:
    # Solo en este repositorio, no en las copias (forks).
    if: github.repository == 'JosebaDG/Pvpc-bridge'
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.toca.outputs.seguir }}
      actualizar: ${{ steps.toca.outputs.actualizar }}
    steps:
      - id: toca
        env:
          EVENTO: ${{ github.event_name }}
          HORARIO: ${{ github.event.schedule }}
          ACTUALIZAR: ${{ inputs.actualizar }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then
            echo "seguir=si" >> "$GITHUB_OUTPUT"
            if [ "$ACTUALIZAR" = "true" ]; then echo "actualizar=si"; else echo "actualizar=no"; fi >> "$GITHUB_OUTPUT"
            exit 0
          fi
          desfase=$(TZ=Europe/Madrid date +%z)
          case "$desfase" in +0100|+0200) ;; *) echo "::error::No se sabe la hora de Madrid ($desfase)"; exit 1 ;; esac
          echo "Horario que ha saltado: $HORARIO (UTC). Desfase de Madrid hoy: $desfase"
          case "$HORARIO|$desfase" in
            "30 19 * * *|+0200"|"30 20 * * *|+0100")
              echo "Son las 21:30 en Madrid: toca publicar."
              echo "seguir=si" >> "$GITHUB_OUTPUT"
              echo "actualizar=si" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Este horario no cae a las 21:30 en Madrid hoy: no se hace nada."
              echo "seguir=no" >> "$GITHUB_OUTPUT"
              echo "actualizar=no" >> "$GITHUB_OUTPUT" ;;
          esac

  publicar:
    needs: hora
    if: needs.hora.outputs.seguir == 'si'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para guardar en main los datos puestos al día
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pone al día el histórico (precios y generación)
        id: historico
        if: needs.hora.outputs.actualizar == 'si'
        # Si REE falla, se publica igual con los datos que ya había, y el aviso queda en el resumen.
        continue-on-error: true
        run: |
          # Con la caché del repo: solo pide lo que falta y el tramo en curso (dos o tres peticiones,
          # con pausas). --con-manana: desde las 21:00 en Madrid, vuelve a pedir el tramo de mañana
          # si la copia guardada aún no trae su PVPC (el último día del mes, el del mes siguiente).
          # El tiempo de Open-Meteo no se pide aquí: la web no lo lee del histórico.
          python3 datos/herramientas/actualizar_historico.py --serie precios --con-manana
          python3 datos/herramientas/actualizar_historico.py --serie generacion

      - name: Pone al día la actividad del equipo («Cómo se ha hecho»)
        id: actividad
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 herramientas/actividad-equipo/actividad.py

      - name: Guarda en main los datos puestos al día
        id: guardar
        if: needs.hora.outputs.actualizar == 'si'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add datos web/datos/actividad.json
          if git diff --cached --quiet; then
            echo "No hay datos nuevos que guardar."
            exit 0
          fi
          # Freno: este paso solo puede tocar datos. Cualquier otro archivo para todo.
          if git diff --cached --name-only | grep -vE '^(datos/|web/datos/actividad\.json$)'; then
            echo "::error::La publicación diaria solo puede guardar datos; hay otros archivos cambiados."
            exit 1
          fi
          git commit -q -m "Datos al día: histórico de REE y actividad del equipo (publicación diaria)"
          for intento in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::No se han podido guardar los datos en main."
          exit 1

      - name: Copia los datos dentro de la web
        run: |
          mkdir -p web/datos
          cp datos/historico/pvpc_peninsula_horario/*.csv web/datos/
          cp datos/manifiesto.json web/datos/

      - name: Resumen
        if: always()
        env:
          HIST: ${{ steps.historico.outcome }}
          ACT: ${{ steps.actividad.outcome }}
          GUARDAR: ${{ steps.guardar.outcome }}
        run: |
          ultimo=$(tail -n 1 datos/historico/pvpc_peninsula_horario/$(ls datos/historico/pvpc_peninsula_horario | sort | tail -n 1) | cut -d, -f1)
          manana=$(TZ=Europe/Madrid date -d tomorrow +%F)
          if grep -q "^$manana" datos/historico/pvpc_peninsula_horario/*.csv; then
            precio_manana="sí, el del $manana"
          else
            precio_manana="todavía no (lo vuelve a intentar la siguiente ejecución)"
          fi
          {
            echo "### Publicación de la web"
            echo "- Histórico: ${HIST:-no tocaba} · último dato del PVPC: $ultimo"
            echo "- Precio de mañana guardado: $precio_manana"
            echo "- Actividad del equipo: $ACT"
            echo "- Datos guardados en main: ${GUARDAR:-no tocaba}"
          } >> "$GITHUB_STEP_SUMMARY"
          for s in "$HIST" "$ACT" "$GUARDAR"; do
            [ "$s" = "failure" ] && echo "::warning::Algún paso de datos ha fallado; se publica con lo que había."
          done
          true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
